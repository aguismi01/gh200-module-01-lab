name: 10-Contexts

on:
  push

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Display infos
        run: |
          echo "Github event name: ${{ github.event_name }}"
          echo "Github ref: ${{ github.ref }}"
          echo "Github Sha: ${{ github.sha }}" 
          echo "Github event action: ${{ github.event.action }}"
      - name: Runner OS
        run: echo 'Runner OS is ${{ runner.os }}'
      - name: Step 1
        id: step-1
        run: echo "Step-1"

      - name: Show step outcome
        run: echo "Step result is ${{ steps.step-1.outcome }}"
  report:
    needs: inspect
    runs-on: ubuntu-latest
    steps:
      - name: Show job result
        run: echo "Inspect job result is ${{ needs.inspect.result }}"
    
  