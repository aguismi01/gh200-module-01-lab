name: Node test

on:
  push:
    branches:
      - practice

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 24
      
      - name: Install dependencies
        run: npm i
      
      - name: Run tests
        run: npm test