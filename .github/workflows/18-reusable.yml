name: 18 reusable

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
    outputs:
      label_name:
        value: ${{ jobs.test.outputs.label }}
    secrets:
      NPM_TOKEN:
        required: true

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      label: ${{ steps.build-label.outputs.label }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node_version }}
      - name: install
        env:
          NPM_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm i

      - name: Set a label output 
        id: build-label
        run: echo "label=build-v1" >> $GITHUB_OUTPUT