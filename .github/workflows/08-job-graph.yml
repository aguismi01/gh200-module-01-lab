name: 08 Job Graph workflow

on:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a Lint job"
  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a Test job"
  report:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - run: echo "This is a report job"
